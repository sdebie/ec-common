name: Release and Publish Common Library

on:
  push:
    branches:
      - main

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  # Job 1: Strip SNAPSHOT and push clean release version
  strip-snapshot:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Configure Maven for GitHub Packages Auth
        uses: s4u/maven-settings-action@v4.0.0
        with:
          servers: |
            [
              {
                "id": "github-parent",
                "username": "${{ github.actor }}",
                "password": "${{ secrets.GITHUB_TOKEN }}"
              },
              {
                "id": "github-common",
                "username": "${{ github.actor }}",
                "password": "${{ secrets.GITHUB_TOKEN }}"
              }
            ]

      - name: Strip SNAPSHOT from project version and properties
        run: |
          # 1. Evaluate current version (print verbose logs if Maven fails)
          CURRENT_VERSION=$(mvn -B help:evaluate -Dexpression=project.version -q -DforceStdout) || {
            echo "❌ Maven help:evaluate failed! Running without quiet mode to reveal details:"
            mvn -B help:evaluate -Dexpression=project.version -DforceStdout
            exit 1
          }
          
          echo "Current project version is: '$CURRENT_VERSION'"
          
          if [[ "$CURRENT_VERSION" == *"-SNAPSHOT"* ]]; then
            RELEASE_VERSION=${CURRENT_VERSION%-SNAPSHOT}
            echo "Stripping SNAPSHOT from project: $CURRENT_VERSION -> $RELEASE_VERSION"
          
            # 2. Set main module release version
            mvn -B versions:set -DnewVersion=${RELEASE_VERSION} -DgenerateBackupPoms=false
          
            # 3. Strip SNAPSHOT from parent version if present
            if grep -q "<parent>" pom.xml; then
              sed -i '/<parent>/,/<\/parent>/s/-SNAPSHOT<\/version>/<\/version>/' pom.xml
            fi
          
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
          
            if [[ -n $(git status --porcelain) ]]; then
              # Ensure runner is aligned with main branch
              git checkout -B main
          
              git commit -am "chore(release): set clean main release v${RELEASE_VERSION} [skip ci]"
          
              # Force overwrite local tag
              git tag -f "v${RELEASE_VERSION}"
          
              # Push HEAD directly to remote refs/heads/main and push tag
              git push origin HEAD:refs/heads/main
              git push origin "v${RELEASE_VERSION}" --force
            else
              echo "No files were changed. Skipping commit."
            fi
          else
            echo "Main branch is already on clean version ($CURRENT_VERSION). No action needed."
          fi

  # Job 2: Runs strictly AFTER strip-snapshot succeeds
  publish-jar:
    needs: strip-snapshot
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5
        with:
          ref: main # Pull the freshly committed clean release version

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Configure Maven for GitHub Packages Auth
        uses: s4u/maven-settings-action@v4.0.0
        with:
          servers: |
            [
              {
                "id": "github-parent",
                "username": "${{ github.actor }}",
                "password": "${{ secrets.GITHUB_TOKEN }}"
              },
              {
                "id": "github",
                "username": "${{ github.actor }}",
                "password": "${{ secrets.GITHUB_TOKEN }}"
              }
            ]

      - name: Publish to GitHub Packages
        run: mvn --batch-mode deploy -DskipTests